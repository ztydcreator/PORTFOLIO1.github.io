<head>

<body>

      <a class="brand" href="index.html">Collins Okolo T</a>
      <nav aria-label="Main navigation">
        <ul>

      </nav>
    </div>
  </header>

  <main>
    <h1>Contact me</h1>
    <p>Fill in the form below and I will get back to you.</p>

    <form id="contactForm" class="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <span class="error" id="nameErr"></span>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <span class="error" id="emailErr"></span>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="numeric">
      <span class="error" id="phoneErr"></span>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>
      <span class="error" id="messageErr"></span>

      <button type="submit" class="btn">Send message</button>
      <p id="success" role="status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Collins. Built with HTML, CSS and JavaScript.</p>
  </footer>
  <script src="js/contact.js"></script>
</body>
